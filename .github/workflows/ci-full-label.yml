# Extra OS coverage when someone (or Codex READY) adds `ci:full`.
# Must not define a job named `linux`, `windows`, or `macos`: a skipped
# check is treated as success and would overlay a failed check of the
# same name (CSL-202). Unrelated labels skip this caller only; the
# reusable matrix is not instantiated.
# Main CI in ci.yml does not listen for labeled/unlabeled.
name: CI full label

on:
  pull_request:
    types: [labeled]

concurrency:
  group: ci-full-label-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extra-os:
    name: ci-full-extra-os
    if: >
      github.event.pull_request.draft == false &&
      github.event.label.name == 'ci:full'
    uses: ./.github/workflows/ci-full-matrix.yml
