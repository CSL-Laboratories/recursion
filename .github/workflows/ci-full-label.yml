# Extra OS coverage when someone (or Codex READY) adds `ci:full`.
# Must not define a job named `linux`: a skipped/no-op linux check is
# treated as success and would overlay a failed required check (CSL-202).
# Main CI in ci.yml does not listen for labeled/unlabeled.
name: CI full label

on:
  pull_request:
    types: [labeled]

concurrency:
  group: ci-full-label-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  windows:
    name: windows
    if: >
      github.event.pull_request.draft == false &&
      github.event.label.name == 'ci:full'
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 20
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Provider-free gate
        run: python -X utf8 -B tools/ci_gate.py --force

  macos:
    name: macos
    if: >
      github.event.pull_request.draft == false &&
      github.event.label.name == 'ci:full'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Provider-free gate
        run: python -X utf8 -B tools/ci_gate.py --force
