# Called only from ci-full-label.yml when the added label is `ci:full`.
# Jobs named windows/macos live here so unrelated labeled events (which skip
# the caller) never instantiate them and cannot overlay a failed OS check.
name: CI full matrix

on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  windows:
    name: windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Provider-free gate
        run: python -X utf8 -B tools/ci_gate.py --force

  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Provider-free gate
        run: python -X utf8 -B tools/ci_gate.py --force
