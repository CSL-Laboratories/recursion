# GitHub-hosted macOS is ~$0.08/min. Do not run it on every master push.
# Nightly coverage of master at 07:17 UTC (off-peak US), skipped when master
# has no commits in the last 24 hours. PR/dispatch macOS stays in ci.yml
# behind workflow_dispatch and the ci:full label.
name: CI macos nightly

on:
  schedule:
    - cron: "17 7 * * *"

concurrency:
  group: ci-macos-nightly
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Skip if master had no commits in 24h
        id: recent
        run: |
          count="$(git rev-list --count --since='24 hours ago' HEAD)"
          echo "commits_in_24h=${count}"
          echo "commits_in_24h=${count}" >> "$GITHUB_OUTPUT"
          if [ "${count}" -eq 0 ]; then
            echo "No master commits in the last 24 hours; skipping macOS suite."
            echo "run_suite=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_suite=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.recent.outputs.run_suite == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        if: steps.recent.outputs.run_suite == 'true'
        run: python -m pip install -r requirements-ci.txt

      - name: Provider-free gate
        if: steps.recent.outputs.run_suite == 'true'
        run: python -X utf8 -B tools/ci_gate.py --force
