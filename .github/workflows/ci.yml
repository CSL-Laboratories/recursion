# Recursion v3 — tiered provider-free CI (CSL-255: light preflight, full tests).
# All jobs use free GitHub-hosted runners (CSL-408); `paid` names the test runner.
# Required status check (branch protection): linux
# Windows and macOS are extra OS coverage, not required on every PR.
#
# Jobs:
# - preflight (ubuntu-latest, free): full-history checkout, the existing path
#   filter (tools/ci_gate.py --paths-only), the lightweight checks (whitespace
#   and public scope via ci_gate.run_lightweight) on every event including
#   drafts, then a shell that validates and emits run_full and paid as exact
#   true/false strings. paid is true only for full scope on a non-draft event.
# - settle (ubuntu-latest, free): 120 s pause on every non-draft PR synchronize
#   so a pushed series settles before the paid runner starts. Skipped otherwise.
# - linux-tests (ubuntu-24.04, free): dependency install, provider-free gate and
#   the perf check. Starts only after preflight succeeded with paid and run_full
#   exactly true, the PR is not a draft, and settle has its expected result.
#   always() && !cancelled() keeps a deliberately skipped settle from blocking
#   it while never starting it on a cancelled run.
# - linux (ubuntu-latest, free, required): no checkout. A shell that fails
#   closed on drafts, cancelled or failed dependencies, missing or malformed
#   outputs, an unexpected settle result, or a non-success full suite.
#   Docs-only scope requires verified lightweight checks and expected skips.
# - windows and macos: platform coverage unchanged; gated on preflight, settle
#   and linux with explicit status functions so a skipped settle does not
#   suppress them.
#
# GitHub's == is case-insensitive. The paid jobs compare outputs that the
# preflight shell already validated as exact true/false, and the required
# linux shell re-validates them.
#
# Drafts never allocate the paid runner from this workflow; the linux job
# reports that qualification is deferred until ready_for_review. The separate
# ci-full-label.yml is unchanged and remains an explicit full request.
#
# Excluded from this gate (not general CI / not runnable here):
# - tools/check_v3_orientation.py — frozen 2026-09-13 allowed-path repair
# - docs/v3/construction/next-work-20260914/check_handoff.py — T-01 spec freeze
#   (already fails on master: ACCEPTANCE.md changed after that packet)
# - delegated-q check.py --mode preflight — packet-scoped source_gate (seven
#   additive paths from TASK_BASE only)
# - delegated-q check.py --mode execute — Owner-gated scientific admission;
#   needs secrets, a trusted controller, and live resource observations
# - tools/check_next_phase.py — needs Java/TLA+, not the current product suite
#
# PRs also run tools/perf_ci.py inside the linux-tests job. It times the
# provider-free planning kernel against the PR base and warns above a 10%
# slowdown. That warning does not fail linux-tests or the required linux
# check, and it does not start a second runner. The step is capped at one
# minute with continue-on-error. `timeout 55` lets the shell emit ::warning::
# on hang; timeout-minutes is a backstop, and a follow-up step warns if that
# backstop kills the shell.
#
# Do not listen for labeled/unlabeled. A skipped or no-op job named `linux` is
# treated as success and would overlay a failed required check on the same SHA.
# Adding `ci:full` starts windows/macos from ci-full-label.yml (no linux job).
# `ci:full` also gates windows/macos on the next synchronize / ready_for_review
# / dispatch / master push. Discord `/ci full` retriggers.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # Free: path filter, lightweight checks, validated scope outputs. Every event.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.scope.outputs.run_full }}
      paid: ${{ steps.scope.outputs.paid }}
    steps:
      # Full history: the path filter and whitespace check diff against the base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Path filter
        id: paths
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -X utf8 -B tools/ci_gate.py --paths-only

      # Public-scope and whitespace run on every event, drafts and docs-only included.
      - name: Lightweight checks
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -X utf8 -B -c "import sys; sys.path.insert(0, 'tools'); import ci_gate; ci_gate.run_lightweight()"

      # Exact-string validation in the shell; GitHub == would accept TRUE/True.
      - name: Scope outputs
        id: scope
        env:
          RUN_FULL: ${{ steps.paths.outputs.run_full }}
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -eu
          case "$RUN_FULL" in
            true|false) ;;
            *) echo "::error::path filter emitted run_full='$RUN_FULL' (expected true or false)"; exit 1 ;;
          esac
          draft=false
          if [ "$EVENT_NAME" = pull_request ]; then
            case "$PR_DRAFT" in
              true) draft=true ;;
              false) ;;
              *) echo "::error::pull request draft flag is '$PR_DRAFT' (expected true or false)"; exit 1 ;;
            esac
          elif [ -n "$PR_DRAFT" ]; then
            echo "::error::draft flag '$PR_DRAFT' on a $EVENT_NAME event"; exit 1
          fi
          paid=false
          if [ "$RUN_FULL" = true ] && [ "$draft" = false ]; then
            paid=true
          fi
          if [ "$draft" = true ]; then
            echo "draft pull request: Linux tests and the required linux check are deferred until ready_for_review"
          fi
          echo "run_full=$RUN_FULL paid=$paid"
          { echo "run_full=$RUN_FULL"; echo "paid=$paid"; } >> "$GITHUB_OUTPUT"

  # Free: pause on every non-draft PR synchronize (any scope) so the series settles.
  settle:
    name: settle
    needs: [preflight]
    if: >
      needs.preflight.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Let the pushed series settle
        run: sleep 120

  # Paid: the full provider-free gate. Never on drafts or cancelled runs.
  linux-tests:
    name: Linux tests
    needs: [preflight, settle]
    if: >
      always() && !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.paid == 'true' &&
      needs.preflight.outputs.run_full == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      ((github.event_name == 'pull_request' && github.event.action == 'synchronize' && needs.settle.result == 'success') ||
       (!(github.event_name == 'pull_request' && github.event.action == 'synchronize') && needs.settle.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Full history: delegated-Q test_contract.py resolves TASK_BASE (0c908f6)^{tree}.
      # Packed repo is ~19MB, so this is cheaper than a second fetch of that commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Provider-free gate
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -X utf8 -B tools/ci_gate.py --force

      # Same job and runner as the gate. Slowdowns warn; a crash, timeout, or
      # missing measurement is advisory. `timeout 55` keeps || runnable;
      # timeout-minutes: 1 is a backstop whose failure is warned below.
      - name: Performance regression check
        id: perf
        if: github.event_name == 'pull_request'
        timeout-minutes: 1
        continue-on-error: true
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: timeout 55 python -X utf8 -B tools/perf_ci.py || echo "::warning::Performance measurement failed, timed out, or is unavailable"

      - name: Warn if performance measurement failed
        if: always() && steps.perf.outcome == 'failure'
        run: echo "::warning::Performance measurement failed, timed out, or is unavailable"

  # Required check. Runs on every outcome and fails closed in the shell.
  linux:
    name: linux
    needs: [preflight, settle, linux-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_full: ${{ needs.preflight.outputs.run_full }}
    steps:
      - name: Required status
        if: ${{ !cancelled() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PREFLIGHT: ${{ needs.preflight.result }}
          RUN_FULL: ${{ needs.preflight.outputs.run_full }}
          PAID: ${{ needs.preflight.outputs.paid }}
          SETTLE: ${{ needs.settle.result }}
          TESTS: ${{ needs.linux-tests.result }}
        run: |
          set -eu
          case "$EVENT_NAME" in
            pull_request)
              case "$EVENT_ACTION" in
                opened|synchronize|reopened|ready_for_review) ;;
                *) echo "::error::unexpected pull_request action '$EVENT_ACTION'"; exit 1 ;;
              esac
              case "$PR_DRAFT" in
                false) ;;
                true)
                  echo "::error::draft pull request: linux qualification is deferred until ready_for_review"
                  exit 1 ;;
                *) echo "::error::unreadable pull request draft flag '$PR_DRAFT'"; exit 1 ;;
              esac ;;
            push|workflow_dispatch)
              if [ -n "$PR_DRAFT" ]; then
                echo "::error::draft flag '$PR_DRAFT' on a $EVENT_NAME event"; exit 1
              fi ;;
            *) echo "::error::unexpected event '$EVENT_NAME'"; exit 1 ;;
          esac
          if [ "$PREFLIGHT" != success ]; then
            echo "::error::preflight result is '$PREFLIGHT' (failed, cancelled, or skipped runs do not qualify)"; exit 1
          fi
          case "$RUN_FULL" in
            true|false) ;;
            *) echo "::error::preflight run_full output is '$RUN_FULL'"; exit 1 ;;
          esac
          case "$PAID" in
            true|false) ;;
            *) echo "::error::preflight paid output is '$PAID'"; exit 1 ;;
          esac
          if [ "$EVENT_NAME" = pull_request ] && [ "$EVENT_ACTION" = synchronize ]; then
            expected_settle=success
          else
            expected_settle=skipped
          fi
          if [ "$SETTLE" != "$expected_settle" ]; then
            echo "::error::settle result is '$SETTLE' (expected $expected_settle)"; exit 1
          fi
          if [ "$RUN_FULL" = true ]; then
            if [ "$PAID" != true ]; then
              echo "::error::full scope without the paid runner (paid='$PAID')"; exit 1
            fi
            if [ "$TESTS" != success ]; then
              echo "::error::Linux tests result is '$TESTS'"; exit 1
            fi
            echo "linux: full suite passed on the paid runner"
          else
            if [ "$PAID" != false ]; then
              echo "::error::docs-only scope with paid='$PAID'"; exit 1
            fi
            if [ "$TESTS" != skipped ]; then
              echo "::error::Linux tests result is '$TESTS' on docs-only scope"; exit 1
            fi
            echo "linux: docs-only scope, lightweight checks passed in preflight"
          fi

      - name: Reject workflow cancellation
        if: cancelled()
        run: |
          echo "::error::workflow cancelled; linux qualification is incomplete"
          exit 1

  windows:
    name: windows
    needs: [preflight, settle, linux]
    if: >
      always() && !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.linux.result == 'success' &&
      needs.preflight.outputs.paid == 'true' &&
      needs.preflight.outputs.run_full == 'true' &&
      ((github.event_name == 'pull_request' && github.event.action == 'synchronize' && needs.settle.result == 'success') ||
       (!(github.event_name == 'pull_request' && github.event.action == 'synchronize') && needs.settle.result == 'skipped')) &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ci:full')))
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Provider-free gate
        run: python -X utf8 -B tools/ci_gate.py --force

  # GitHub-hosted macOS is not run on master pushes. Nightly master coverage
  # lives in ci-macos-nightly.yml (07:17 UTC, skipped if no commits in 24h).
  macos:
    name: macos
    needs: [preflight, settle, linux]
    if: >
      always() && !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.linux.result == 'success' &&
      needs.preflight.outputs.paid == 'true' &&
      needs.preflight.outputs.run_full == 'true' &&
      ((github.event_name == 'pull_request' && github.event.action == 'synchronize' && needs.settle.result == 'success') ||
       (!(github.event_name == 'pull_request' && github.event.action == 'synchronize') && needs.settle.result == 'skipped')) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ci:full')))
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Provider-free gate
        run: python -X utf8 -B tools/ci_gate.py --force
