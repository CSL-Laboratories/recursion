# Recursion v3 — tiered provider-free CI.
#
# Required status check (branch protection): linux
# Windows and macOS are extra OS coverage, not required on every PR.
#
# Excluded from this gate (not general CI / not runnable here):
# - tools/check_v3_orientation.py — frozen 2026-09-13 allowed-path repair
# - docs/v3/construction/next-work-20260914/check_handoff.py — T-01 spec freeze
#   (already fails on master: ACCEPTANCE.md changed after that packet)
# - delegated-q check.py --mode preflight — packet-scoped source_gate (seven
#   additive paths from TASK_BASE only)
# - delegated-q check.py --mode execute — Owner-gated scientific admission;
#   needs secrets, a trusted controller, and live resource observations
# - tools/check_next_phase.py — needs Java/TLA+, not the current product suite
#
# PRs also run tools/perf_ci.py inside the linux job. It times the provider-free
# planning kernel against the PR base and warns above a 10% slowdown. That
# warning does not fail the required linux check, and it does not start a
# second runner. The step is capped at one minute with continue-on-error.
# `timeout 55` lets the shell emit ::warning:: on hang; timeout-minutes is a
# backstop, and a follow-up step warns if that backstop kills the shell.
#
# Do not listen for labeled/unlabeled. A skipped or no-op job named `linux` is
# treated as success and would overlay a failed required check on the same SHA.
# Adding `ci:full` starts windows/macos from ci-full-label.yml (no linux job).
# `ci:full` also gates windows/macos on the next synchronize / ready_for_review
# / dispatch / master push. Discord `/ci full` retriggers.
#
# Non-draft pull_request synchronize waits 120s on free GitHub-hosted Ubuntu
# before Blacksmith jobs start. A newer push cancels this run (same concurrency
# group) during that wait. Cancellation after a paid job starts cannot undo billing.
# Other events deliberately skip settle; explicit guards allow selected OS jobs.
# Queue coverage is staged; master-push fallback remains until owner-approved activation.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  # Ordinary PR runs share a group across heads. Label and manual dispatch
  # lanes are separate; a PR push does not cancel those independently requested runs.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  settle:
    name: settle
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for the PR head to settle
        run: sleep 120

  linux:
    name: linux
    needs: settle
    if: >
      always() && !cancelled() &&
      (needs.settle.result == 'success' ||
       (needs.settle.result == 'skipped' &&
        !(github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.draft == false)))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      run_full: ${{ steps.paths.outputs.run_full }}
      classification: ${{ steps.paths.outputs.classification }}
    steps:
      # Full history: delegated-Q test_contract.py resolves TASK_BASE (0c908f6)^{tree}.
      # Packed repo is ~19MB, so this is cheaper than a second fetch of that commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Path filter
        id: paths
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        run: python3 -X utf8 -B tools/ci_gate.py --paths-only

      - name: Set up Python
        if: steps.paths.outputs.run_full == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        if: steps.paths.outputs.run_full == 'true'
        run: python -m pip install -r requirements-ci.txt

      - name: Provider-free gate
        if: steps.paths.outputs.run_full == 'true'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        run: python -X utf8 -B tools/ci_gate.py --force

      # Same job and runner as the gate. Slowdowns warn; a crash, timeout, or
      # missing measurement is advisory. `timeout 55` keeps || runnable;
      # timeout-minutes: 1 is a backstop whose failure is warned below.
      - name: Performance regression check
        id: perf
        if: github.event_name == 'pull_request' && steps.paths.outputs.run_full == 'true'
        timeout-minutes: 1
        continue-on-error: true
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: timeout 55 python -X utf8 -B tools/perf_ci.py || echo "::warning::Performance measurement failed, timed out, or is unavailable"

      - name: Warn if performance measurement failed
        if: always() && steps.perf.outcome == 'failure'
        run: echo "::warning::Performance measurement failed, timed out, or is unavailable"

      # Public-scope (and whitespace) must still run when the suite is skipped.
      - name: Docs-only lightweight checks
        if: steps.paths.outputs.run_full != 'true'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        run: python3 -X utf8 -B tools/ci_gate.py

  windows:
    name: windows
    needs: [settle, linux]
    if: >
      always() && !cancelled() &&
      (needs.settle.result == 'success' ||
       (needs.settle.result == 'skipped' &&
        !(github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.draft == false))) &&
      needs.linux.result == 'success' &&
      needs.linux.outputs.run_full == 'true' &&
      (github.event_name == 'push' ||
       github.event_name == 'merge_group' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full')))
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 20
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Provider-free gate
        run: python -X utf8 -B tools/ci_gate.py --force

  # GitHub-hosted macOS is not run on master pushes. Nightly master coverage
  # lives in ci-macos-nightly.yml (07:17 UTC, skipped if no commits in 24h).
  macos:
    name: macos
    needs: [settle, linux]
    if: >
      always() && !cancelled() &&
      (needs.settle.result == 'success' ||
       (needs.settle.result == 'skipped' &&
        !(github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.draft == false))) &&
      needs.linux.result == 'success' &&
      needs.linux.outputs.run_full == 'true' &&
      (github.event_name == 'merge_group' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full')))
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Provider-free gate
        run: python -X utf8 -B tools/ci_gate.py --force

  platform-gates:
    name: platform-gates
    needs: [settle, linux, windows, macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject workflow cancellation
        if: cancelled()
        run: exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools/ci_results.py
          sparse-checkout-cone-mode: false
      - name: Require every selected platform result
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
          CI_ACTION: ${{ github.event.action }}
          CI_DRAFT: ${{ github.event.pull_request.draft || false }}
          CI_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: python3 -X utf8 -B tools/ci_results.py
