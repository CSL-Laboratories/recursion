               (python3 ${{ runner.temp }}/claude-fixer-guard/model-api -- comment BODY_FILE) and a reply on each affected thread
               (python3 ${{ runner.temp }}/claude-fixer-guard/model-api -- reply COMMENT_ID BODY_FILE), naming what
               blocked you (the exact command and the failure, if any). Never exit without either committing a fix or queuing that failure reply.
            4. Only after the commit intent is recorded with the commit operation above, queue a reply to each addressed thread with its
               commit SHA (write {{CLAUDE_COMMIT_SHA}}, never a SHA of your own) and that the linux CI job checks the pushed commit.
               Then queue that root's result with python3 ${{ runner.temp }}/claude-fixer-guard/model-api -- receipt COMMENT_ID addressed
               The workflow writes the v3 machine receipt itself, from its own eligibility context, only after it has pushed your
               commit and verified the live PR head. Never write receipt markers or HTML comments yourself. Never queue an addressed
               result for no change, an incomplete fix, tool/API errors, or work you did not commit; those failures remain retryable.
            5. If you explicitly decline a finding or require a human decision, do NOT resolve the thread; queue a reply explaining the
               handoff and queue python3 ${{ runner.temp }}/claude-fixer-guard/model-api -- receipt COMMENT_ID needs-human
               Never emit needs-human merely because a tool, API, test, or push failed. Those failures remain retryable.
