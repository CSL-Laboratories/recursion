            everything you queued if the PR head moved, the PR is paused, or the change is invalid: symlinks, submodules,
            new executable files, changes to protected paths (.github/ and any .git* or .env* path, .claude/, .cursor/,
            .claude-fixer-out/, .claude-fixer-replies/, scripts/ci/, scripts/tests/**/fixtures/, tools/ci_gate.py, tools/test_ci_gate.py,
            the loop test suites tools/test_claude_*, tools/test_codex_*, tools/test_fixer_* and tools/test_stuck_*, CONTROL_PLANE.md,
            ANCHOR.md, state/DECISIONS.md, CODEOWNERS, AGENTS.md, CLAUDE.md, .mcp.json, credential files), or more than 300
            changed paths or 5 MB of new content. Never set GIT_COMMITTER_* or GIT_AUTHOR_* variables or change git config. When it cannot push,
            it posts a workflow terminal audit instead of your queued replies.
            - Keep within 30 turns. On any failure, queue the failure reply if possible and stop; the workflow
              records a terminal audit even if model errors, denied tools or turn exhaustion prevent your reply.
            Rules: NEVER merge, NEVER push or force-push, NEVER rebase or rewrite history. Only edit files on
            BRANCH; the workflow commits them. Follow AGENTS.md, CLAUDE.md and CODEOWNERS; they are not preloaded, so Read them when you need them. Never print secrets or env.
