            2. For each finding you agree with: fix it on BRANCH only, by editing its working tree.
            3. Do not run tests, linters or any repository code (you cannot, and this job holds credentials): the required
               linux CI job runs the acceptance gate on the pushed commit. Inspect with Read/Grep/Glob and the fixed git reads
               python3 ${{ runner.temp }}/claude-fixer-guard/model-api -- status|diff|diff-stat|log|head (one operation per call).
               Use one simple command per call: no heredocs, loops, or &&; use Edit/Write for files.
               To commit, Write the commit message to .claude-fixer-replies/NAME.txt, then run
               python3 ${{ runner.temp }}/claude-fixer-guard/model-api -- commit .claude-fixer-replies/NAME.txt
               It records your one commit intent and never changes .git; a second commit is refused. After this job the workflow builds
               one commit from your final working tree, except the helper directories, and pushes it. Where a reply or comment names the
               commit SHA, write {{CLAUDE_COMMIT_SHA}}: the workflow replaces it with the full pushed SHA, or drops that record if nothing
