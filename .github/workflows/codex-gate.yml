# Codex routes READY to ci:full and MEDIATE to stuck-thread-watch.
# Devin and human requests alone trigger fixes. Missing/FIX verdicts do nothing.
# Writes use CODEX_TRIGGER_PAT; missing PAT skips without printing secrets.
name: Codex CI/mediation gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

concurrency:
  # Each review.id isolates verdict handling; new pushes cancel superseded requests.
  group: codex-gate-${{ github.event.pull_request.number }}-${{ github.event_name == 'pull_request_review' && format('verdict-{0}', github.event.review.id) || 'request' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_review' }}

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  request:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Default branch only: a pull_request checkout would run PR-head code
          # with CODEX_TRIGGER_PAT (same class of leak as CSL-87).
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/codex_gate.py
          sparse-checkout-cone-mode: false
      - name: Post @codex review once per head SHA
        id: gate
        env:
          CODEX_GATE_MODE: request
          CODEX_TRIGGER_PAT: ${{ secrets.CODEX_TRIGGER_PAT }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          script=scripts/ci/codex_gate.py
          if [ ! -f "$script" ]; then
            echo "::notice::$script is not on the default branch yet; skip"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -X utf8 -B "$script" request

  verdict:
    if: >-
      github.event_name == 'pull_request_review' &&
      (
        github.event.review.user.login == 'chatgpt-codex-connector[bot]' ||
        github.event.review.user.login == 'chatgpt-codex-connector'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/codex_gate.py
          sparse-checkout-cone-mode: false
      - name: Act on CODEX-GATE verdict
        env:
          CODEX_GATE_MODE: verdict
          CODEX_TRIGGER_PAT: ${{ secrets.CODEX_TRIGGER_PAT }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          script=scripts/ci/codex_gate.py
          if [ ! -f "$script" ]; then
            echo "::notice::$script is not on the default branch yet; skip"
            exit 0
          fi
          python3 -X utf8 -B "$script" verdict
