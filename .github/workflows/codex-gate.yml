# Codex admits exact-candidate READY to full CI and routes MEDIATE to the watcher.
# Devin and human requests alone trigger fixes. Missing/FIX verdicts do nothing.
# Writes use CODEX_TRIGGER_PAT; missing PAT skips without printing secrets.
name: Codex CI/mediation gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Request exact-candidate review after a base change; never starts CI directly"
        required: true
        type: string
  pull_request_review:
    types: [submitted, edited, dismissed]

concurrency:
  # Each review.id isolates verdict handling; new pushes cancel superseded requests.
  group: codex-gate-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event_name == 'pull_request_review' && format('verdict-{0}', github.event.review.id) || 'request' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_review' }}

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  request:
    needs: verdict
    concurrency:
      group: claude-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
      queue: max
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Default branch only: a pull_request checkout would run PR-head code
          # with CODEX_TRIGGER_PAT (same class of leak as CSL-87).
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/codex_gate.py
            scripts/ci/claude_fixer_receipts.py
            scripts/ci/candidate_gate.py
            scripts/ci/merge_candidate.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Request independent review of the exact merge candidate
        id: gate
        env:
          CODEX_GATE_MODE: request
          CODEX_TRIGGER_PAT: ${{ secrets.CODEX_TRIGGER_PAT }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          script=scripts/ci/candidate_gate.py
          if [ ! -f "$script" ]; then
            echo "::notice::$script is not on the default branch yet; skip"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -X utf8 -B "$script" request

  verdict:
    outputs:
      admitted: ${{ steps.verdict.outputs.admitted }}
      duplicate: ${{ steps.verdict.outputs.duplicate }}
      candidate: ${{ steps.verdict.outputs.candidate }}
      head: ${{ steps.verdict.outputs.head }}
      base: ${{ steps.verdict.outputs.base }}
      merge: ${{ steps.verdict.outputs.merge }}
      tree: ${{ steps.verdict.outputs.tree }}
      review: ${{ steps.verdict.outputs.review }}
      writer: ${{ steps.verdict.outputs.writer }}
    # Serialize every observation-journal writer with the fixer/human PR writers.
    # Dispatches are fire-and-forget; this job never waits for another writer.
    concurrency:
      group: claude-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
      queue: max
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' &&
       (github.event.review.user.login == 'chatgpt-codex-connector[bot]' ||
        github.event.review.user.login == 'chatgpt-codex-connector'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # Owner-approved: authenticate label ownership/recovery receipts only here.
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/codex_gate.py
            scripts/ci/claude_fixer_receipts.py
            scripts/ci/candidate_gate.py
            scripts/ci/merge_candidate.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Invalidate stale ownership or admit exact independent READY candidate
        id: verdict
        env:
          CODEX_GATE_MODE: verdict
          CODEX_TRIGGER_PAT: ${{ secrets.CODEX_TRIGGER_PAT }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          script=scripts/ci/candidate_gate.py
          if [ ! -f "$script" ]; then
            echo "::notice::$script is not on the default branch yet; skip"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request_review ]; then
            python3 -X utf8 -B "$script" admit
          else
            python3 -X utf8 -B "$script" invalidate
          fi

  matrix:
    needs: verdict
    if: needs.verdict.outputs.admitted == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      candidate: ${{ needs.verdict.outputs.candidate }}
      merge_sha: ${{ needs.verdict.outputs.merge }}
      base_sha: ${{ needs.verdict.outputs.base }}
      tree_sha: ${{ needs.verdict.outputs.tree }}

  candidate-readiness:
    name: ${{ (github.event_name == 'pull_request_review' && needs.verdict.outputs.duplicate != 'true' && (github.event.review.user.login == 'chatgpt-codex-connector[bot]' || github.event.review.user.login == 'chatgpt-codex-connector')) && 'candidate-readiness' || 'ignored-event-candidate-readiness' }}
    # Staged only. Activation needs separate owner approval of protection.
    # Native pull_request_review check identity is its event merge SHA.
    needs: [verdict, matrix]
    if: >-
      always() && github.event_name == 'pull_request_review' &&
      needs.verdict.outputs.duplicate != 'true' &&
      (github.event.review.user.login == 'chatgpt-codex-connector[bot]' ||
       github.event.review.user.login == 'chatgpt-codex-connector')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject cancellation
        if: cancelled()
        run: exit 1
      - name: Require admitted complete matrix and reject cancellation
        env:
          ADMITTED: ${{ needs.verdict.outputs.admitted }}
          MATRIX: ${{ needs.matrix.result }}
        run: test "$ADMITTED" = true && test "$MATRIX" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/codex_gate.py
            scripts/ci/claude_fixer_receipts.py
            scripts/ci/candidate_gate.py
            scripts/ci/merge_candidate.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recheck candidate, latest review, holds and label generation
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.verdict.outputs.candidate }}
          REVIEW_ID: ${{ needs.verdict.outputs.review }}
          GATE_WRITER: ${{ needs.verdict.outputs.writer }}
          MATRIX_RESULT: ${{ needs.matrix.result }}
        run: python3 -X utf8 -B scripts/ci/candidate_gate.py finish
