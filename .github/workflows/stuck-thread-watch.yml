# Stuck Devin/Claude review threads → Codex mediator, then optional auto-resolve.
#
# Own file on purpose: a cron inside claude.yml never fired because of event
# noise. Lightweight GitHub-hosted runner, no test jobs.
#
# Caps: one mediation per thread, max 3 per PR per UTC day;
# one auto-resolve per thread, max 3 per PR per UTC day.
# Never push or merge.
#
# Tokens
# - GH_TOKEN (github.token): read PRs and write issue labels. This workflow
#   keeps pull-requests: read, so the Actions token cannot resolve threads.
# - CODEX_TRIGGER_PAT: post @codex review (Codex only triggers on this user),
#   reply on the review thread, and call resolveReviewThread. Same user token
#   on purpose so the citation and resolve are not attributed to
#   github-actions[bot]. Missing PAT skips writes with a notice.
name: Stuck-thread watch

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Only scan this PR number (optional)"
        required: false
        default: ""
  # Cheap paths: Claude replies may mark a thread stuck; Codex rulings may
  # make a mediated thread eligible to auto-resolve.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted, edited]

# Tunables. Edit here; the script reads them from the environment.
env:
  STUCK_AFTER_HOURS: "6"
  MAX_MEDIATIONS_PER_PR_PER_DAY: "3"
  MAX_RESOLVES_PER_PR_PER_DAY: "3"
  LINEAR_REPOS: "CSL-Laboratories/recursion"
  DEVIN_LOGIN: "devin-ai-integration[bot]"
  CLAUDE_LOGIN: "claude[bot]"
  CODEX_REVIEW_LOGIN: "chatgpt-codex-connector[bot]"
  LINEAR_TEAM_KEY: "CSL"

concurrency:
  group: stuck-thread-watch
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  watch:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (
          github.event.comment.user.login == 'claude[bot]' ||
          github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
        )
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        (
          github.event.comment.user.login == 'claude[bot]' ||
          github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
        )
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        github.event.review.user.login == 'chatgpt-codex-connector[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Always the default branch: comment/review triggers would otherwise
          # run PR-head code with CODEX_TRIGGER_PAT and LINEAR_API_KEY.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/stuck_thread_watch.py
            scripts/ci/fixer_failure_escalation.py
            scripts/ci/claude_fixer_receipts.py
          sparse-checkout-cone-mode: false

      - name: Scan stuck threads
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_TRIGGER_PAT: ${{ secrets.CODEX_TRIGGER_PAT }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
        run: |
          script=.github/scripts/stuck_thread_watch.py
          if [ ! -f "$script" ]; then
            echo "::notice::$script is not on the default branch yet; skip"
            exit 0
          fi
          python3 -X utf8 -B "$script"
