# Stuck-thread watch: one Linear roll-up per PR for stuck Devin review threads.
#
# Runs only when a person dispatches it (CSL-238). Its Codex mediation and
# auto-resolve were retired with the Codex gate when the Codex subscription and
# API key expired (Nov 16, 2026): no Codex token is passed, so the script skips
# both with a notice and posts nothing to GitHub. Devin retired on Nov 11, 2026,
# so no new thread qualifies; a run updates or cancels existing roll-ups only.
# Own file on purpose: a cron inside claude.yml never fired because of event
# noise. Lightweight GitHub-hosted runner, no test jobs. Never push or merge.
#
# Tokens
# - GH_TOKEN (github.token): read PRs. pull-requests: read, so it cannot call
#   resolveReviewThread.
# - LINEAR_API_KEY: the roll-up. A missing key skips Linear with a notice.
name: Stuck-thread watch

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Only scan this PR number (optional)"
        required: false
        default: ""

# Tunables. Edit here; the script reads them from the environment.
env:
  STUCK_AFTER_HOURS: "6"
  LINEAR_REPOS: "CSL-Laboratories/recursion"
  DEVIN_LOGIN: "devin-ai-integration[bot]"
  CLAUDE_LOGIN: "claude[bot]"
  LINEAR_TEAM_KEY: "CSL"

concurrency:
  group: stuck-thread-watch
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Always the default branch: a dispatch on another ref would otherwise
          # run unreviewed code with LINEAR_API_KEY.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/stuck_thread_watch.py
            scripts/ci/fixer_failure_escalation.py
            scripts/ci/claude_fixer_receipts.py
          sparse-checkout-cone-mode: false

      - name: Scan stuck threads
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          script=.github/scripts/stuck_thread_watch.py
          if [ ! -f "$script" ]; then
            echo "::notice::$script is not on the default branch yet; skip"
            exit 0
          fi
          python3 -X utf8 -B "$script"
