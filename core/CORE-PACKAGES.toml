# The list of packages that may stand under core/recursion_core/, one row each.
#
# core/tests/test_core_list.py reads this file. It is red when a package stands under the core with no row,
# when a row has no package, when something under the core is skipped by a rule below that does not hold, and
# when the count of packages that wait for the owner differs from for_owner_max. The scan reads the entries
# directly under core/recursion_core/ only; what stands inside a package is that package's own.
#
# A row is keyed by name, the folder or module name directly under core/recursion_core/. Any other reader of this
# file (an import guard, for one) may rely on that key and on the sections.
#
# Sections:
#   core        a line of the pinned product contract, or a decision cited by role and date, places the package
#               in the core.
#   for_owner   the list does not place the package: no cited line is taken as placing it. builds_it names the
#               lane or section that builds it. The owner decides: core, separate package or plugin.
#   leaving     a placing decision moves the package out; moves_to and leave_by (YYYY-MM-DD) are required.
#   expected    a name the hooks seam (control/hooks.py REGISTRANTS) already presumes whose package does not
#               stand yet. A row whose package stands is red: give it its real section.
#
# A cite is one of:
#   a lane      the row of section 7 of the pinned contract that begins with the lane id, such as F3;
#   a section   ONE line inside the numbered section, such as 3.3, that places the package (never the heading);
#   a decision  given by role and date only, such as 'the owner, 2026-11-24'.
# The pinned contract is named by contract/PRODUCT.pin.json; it lives in a private research repository, and this
# file copies none of its words and holds no digest of any of its lines. The digests that name each cited line
# are kept in a file outside this repository; the test reads them, with the pinned bytes, only where a local clone
# and that file are given (CSL_RESEARCH_VAULT and CSL_CORE_LIST_DIGESTS), and says on every run when they were not.

[summary]
# The number of for_owner rows. The test is red when it differs from the count of those rows, so the number
# always equals the count and a new waiting package shows as a raised number in the change.
for_owner_max = 7
# What a passed leave_by does: "red" (the test is red) or "print" (the printed state line names the row and its date).
leave_by_passed = "red"

[rules]
# What under core/recursion_core/ is not a package. Everything else must have a row, or the test is red.
# A rule entry that matches nothing under the core is red.
# Folders the scan skips because they hold no module; one that holds a module is red. __pycache__ only today.
ignored_folders = ["__pycache__"]
# Folders that hold tests only: an __init__.py with at most a docstring, and test_*.py modules whose top level
# holds only imports, assignments, test case classes, test functions and the __main__ guard. Anything else is red.
test_folders = []
# Files directly under the core that are neither modules nor folders. A module named here is red.
other_files = []

[sweep]
# Where the contract is given (CSL_RESEARCH_VAULT), the test reads the files named in scan and is red on a heading of
# the contract, or a run of run_words words of it (words made of letters only; links and numbers left out), standing in
# any of them. A message names the file, the line and a count, and none of the words.
run_words = 6
# Files or folders, as paths from the repository root; "." is the whole tree. One entry that matches nothing is red.
# Each entry is read in its normal form (./a, a/, a//b and a/b/.. all name a). An empty scan, an absolute entry, one
# that leaves the repository and one written twice are red, and so is a leave_out entry that holds a whole scan entry.
scan = ["core/CORE-PACKAGES.toml", "core/tests"]
# Files or folders of the scan that it leaves out. None today.
leave_out = []

