# Every setting of version 1, each set to a value of its own type.
version = 1

[plugin_host]
# The person turned the check off; the reason can stay beside it.
gil_check = false

[status]
# Show each value to 120 characters.
value_max_chars = 120
# Add one word of your own; the shipped words stay.
hidden_names = ["pin"]
# Show no setting under a hidden name anyway.
shown_names = []
