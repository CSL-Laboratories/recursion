# The programs that are not Python which the whole test suite may start, each with its reason.
# tools/network_audit.py (run with no command) allows these by name and refuses any other: what a
# program that is not Python reaches is not watched by the audit hook, so each one is named here.
# A row allows a NAME; the audit does not check which file of that name ran.

[[program]]
name = "claude"
reason = "The engine name the daemon tests give their stand-in engine units (test_adv1_*, test_composition); the tests run with no real engine configured."

[[program]]
name = "env"
reason = "Runs a stand-in under a cleared environment in the child_env tests."

[[program]]
name = "safe-dummy-engine"
reason = "A stand-in engine a subscription_routes test writes in its temporary folder."

[[program]]
name = "safe-engine"
reason = "A stand-in engine a subscription_routes test writes in its temporary folder."

[[program]]
name = "sleep"
reason = "A child that only sleeps, for the launcher and cgroup leaf tests."

[[program]]
name = "systemctl"
reason = "The user manager's control program (or a test's stand-in for it); it talks to the user manager by a local socket."

[[program]]
name = "systemd-run"
reason = "Starts a unit under the user manager (or a test's stand-in for it); it talks to the user manager by a local socket."

[[program]]
name = "unshare"
reason = "Runs a Python child of the test in namespaces of its own (test_adv1_socket_cli_gui)."
