# The list of the ONLY things the shipped package (core/recursion_core, tests not included) may do
# that bear on the network. tools/network_reach.py checks this file against a scan of the syntax
# tree, and what it cannot decide is refused, not passed:
#
# [[module]]    the only modules a shipped file may import or reach (the package's own excepted),
#               each with its reason. Any other module is refused. Some modules are refused outright
#               and no [[module]] row can allow them (the foreign-function modules, the private socket,
#               ssl, subprocess and os modules, zip import, pickle and the other loaders that run code
#               found in data).
# [[construct]] the uses of a construct refused outright in shipped source (running text as code;
#               reaching a module or a function by a built name; a log handler that sends over a
#               network; an import of a test module or of anything outside the package), each with
#               its reason and the exact text of each call: any other use, or a changed call, is refused.
# [[reach]]     every place where the code can open a connection, look up a name, start a program, or
#               load code by a name; with who supplies the address and the exact text of each call
#               (calls), so a call whose arguments change is refused until its row is read again.
# [[literal]]   every literal address in the shipped source, with its reason.
#
# who: settings = an address in your own settings or engine configuration; command = an address you
# give in a command; plugin-grant = only under a grant you gave the plugin; local = a door on this
# machine only (a Unix socket in your own folders, or the loopback address); none = no address at all.
# No row says that an address comes from the code: Recursion sends nothing to its makers.
#
# Plugins: a plugin reaches a network only under a grant you gave. The proof of that belongs to the
# plugin wall (core/recursion_core/plugin_security), not to this list.
#
# names (in a [[module]] row): the only names the package may take from that module. A private name
#               of another module (one that begins with '_') needs a [[construct]] row (private-name).
# callers (in a [[construct]] row, and in a [[reach]] row whose address comes from your settings or a
#               command): the only places of the package that may use that place.

